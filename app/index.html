<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Panel — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>Vice <span>Panel</span></h1>
    <p>Multi-panel cover art, made from your photos</p>
  </div>
  <div class="top-actions">
    <button id="shuffleBtn" type="button">Shuffle panels</button>
    <button id="swapBtn" type="button" aria-pressed="false">Swap panels</button>
    <div class="export-group" role="group" aria-label="Export PNG">
      <button id="exportSquare" type="button">PNG 1080 × 1080</button>
      <button id="exportPortrait" type="button">PNG 1080 × 1350</button>
      <button id="exportWide" type="button">PNG 1920 × 1080</button>
    </div>
  </div>
</header>

<main class="workspace">
  <aside class="panel">
    <section>
      <h2>Layout</h2>
      <div id="layoutChips" class="chips"></div>
    </section>

    <section>
      <h2>Photos</h2>
      <label class="upload-btn" for="photoInput">Add your photos</label>
      <input id="photoInput" type="file" accept="image/*" multiple hidden>
      <div id="tray" class="tray" aria-label="Photo tray"></div>
      <p class="hint">Pick a photo, then click a panel to drop it in — or click a panel first and drag it into place.</p>
    </section>

    <section>
      <h2>Caption</h2>
      <label>Title <input id="titleInput" type="text" maxlength="26" value="Vice Heat"></label>
      <label>Subtitle <input id="subInput" type="text" maxlength="42" value="Sunset City Stories"></label>
    </section>

    <section>
      <h2>Selected panel</h2>
      <p id="panelLabel" class="panel-label">Panel 1</p>
      <div id="filterChips" class="chips"></div>
      <label>Zoom <input id="zoomRange" type="range" min="1" max="3" step="0.01" value="1"></label>
      <button id="clearPanelBtn" type="button" class="ghost">Empty this panel</button>
    </section>

    <section>
      <h2>Finish</h2>
      <label>Colour grade <input id="gradeRange" type="range" min="0" max="100" step="1" value="70"></label>
      <label class="check"><input id="grainToggle" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignetteToggle" type="checkbox" checked> Vignette</label>
    </section>
  </aside>

  <section class="stage">
    <canvas id="cover" width="880" height="1100" aria-label="Cover preview"></canvas>
    <p id="status" class="status" role="status"></p>
  </section>
</main>

<footer class="foot">Vice Panel runs fully offline — your photos never leave this machine.</footer>

<script type="module" src="./src/main.js"></script>
</body>
</html>
